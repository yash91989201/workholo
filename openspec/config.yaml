schema: spec-driven

context: |
  Project skills live in .agents/skills. Read the matching skill before implementation:
  - workholo-orpc-api: oRPC procedures, API schemas, middleware, generated API types.
  - workholo-forms: TanStack Form schemas and form UI patterns.
  - workholo-ui: shared UI package, generic components, Tabler icons.
  - workholo-utils: reusable helper placement and grouping.

rules:
  proposal:
    - Name every project skill that governs the change.
  tasks:
    - Break tasks by the owning project skill.

operations:
  apply:
    guidance:
      - Read the matching .agents/skills/*/SKILL.md files before editing.
  archive:
    guidance:
      - Confirm the matching project skills were followed before archiving.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
