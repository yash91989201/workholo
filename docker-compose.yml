name: workholo

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        VITE_CONSOLE_URL: http://localhost:3003
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      secrets:
        - console_env
        - server_env
      args:
        VITE_SERVER_URL: http://localhost:8000
    init: true
    ports:
      - "3003:3003"
    env_file:
      - path: apps/console/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3003/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
      secrets:
        - agent_env
        - server_env
      args:
        VITE_SERVER_URL: http://localhost:8000
    init: true
    ports:
      - "3004:80"
    env_file:
      - path: apps/agent/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
      secrets:
        - platform_env
        - server_env
      args:
        VITE_SERVER_URL: http://localhost:8000
    init: true
    ports:
      - "3002:3002"
    env_file:
      - path: apps/platform/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3002/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    ports:
      - "8000:8000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      CORS_ORIGIN: http://localhost:3001
      CONSOLE_ORIGIN: http://localhost:3003
      AGENT_ORIGIN: http://localhost:3004
      PLATFORM_ORIGIN: http://localhost:3002
      PORT: 8000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/workholo
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: workholo-postgres
    environment:
      POSTGRES_DB: workholo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - workholo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  workholo_postgres_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  server_env:
    file: apps/server/.env
  console_env:
    file: apps/console/.env
  agent_env:
    file: apps/agent/.env
  platform_env:
    file: apps/platform/.env
